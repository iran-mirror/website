name: Pipeline CI/CD
run-name: ${{ github.actor }} run Actions 🚀
on:
  - push
  - workflow_dispatch

permissions:
  packages: write
  contents: read

jobs:
  docker:
    uses: iran-mirror/gh-actions/.github/workflows/docker.yaml@v1.7
    with:
      debug: true
      registry: ${{ vars.REGISTERY_ADDRESS }}
    secrets:
      REGISTERY_USER: ${{ github.actor }}
      REGISTERY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
  argocd:
    uses: iran-mirror/gh-actions/.github/workflows/argocd.yaml@v1.7
    needs: docker
    with:
      debug: true
      registry: ${{ vars.REGISTERY_ADDRESS }}
    secrets:
      ARGOCD_GIT_SSH_KEY: ${{ secrets.ARGOCD_GIT_SSH_KEY }}
