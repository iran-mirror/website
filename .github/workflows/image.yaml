name: Pipeline CI/CD
run-name: ${{ github.actor }} run Actions 🚀

on:
  - push

jobs:
  docker:
    uses: gh-actions/.github/workflows/docker.yaml@main
    with:
      debug: false
      registry: ${{ vars.REGISTERY_ADDRESS }}
    secrets:
      REGISTERY_USER: ${{ secrets.REGISTERY_USER }}
      REGISTERY_PASSWORD: ${{ secrets.REGISTERY_PASSWORD }}
  argocd:
    uses: gh-actions/.github/workflows/argocd.yaml@main
    needs: docker
    with:
      debug: false
      registry: ${{ vars.REGISTERY_ADDRESS }}
    secrets:
      ARGOCD_GIT_TOKEN: ${{ secrets.ARGOCD_GIT_TOKEN }}
