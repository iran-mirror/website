# Serves the Hugo output. Headers mirror netlify.toml so the container behaves
# like the deployed site.

server {
    listen       8080;
    listen       [::]:8080;
    server_name  _;

    root  /usr/share/nginx/html;
    index index.html;

    charset       utf-8;
    server_tokens off;

    # This container always runs behind a reverse proxy (ingress) that
    # terminates TLS, so the client-facing scheme, host and port differ from
    # this listener's.
    #
    # Rewrite $remote_addr from X-Forwarded-For so access logs and rate limits
    # see the client instead of the proxy. Only honoured for peers inside the
    # ranges below — an untrusted client cannot spoof its own address by
    # sending the header. Narrow these to the actual pod/LB CIDRs if you want
    # a tighter trust boundary.
    set_real_ip_from  10.0.0.0/8;
    set_real_ip_from  172.16.0.0/12;
    set_real_ip_from  192.168.0.0/16;
    set_real_ip_from  127.0.0.0/8;
    set_real_ip_from  fc00::/7;
    set_real_ip_from  ::1/128;
    real_ip_header    X-Forwarded-For;
    # Walk the header right-to-left past every trusted hop, so a chain of
    # LB -> ingress -> service still resolves to the original client.
    real_ip_recursive on;

    # try_files "$uri/" makes nginx 301 a directory request that lacks the
    # trailing slash. An absolute Location would be built from this listener
    # (http + :8080) and downgrade the client off TLS onto an unpublished port.
    # Emitting a relative Location lets the browser keep the external scheme,
    # host and port, so no X-Forwarded-Proto/Host plumbing is needed.
    absolute_redirect off;

    gzip              on;
    gzip_comp_level   6;
    gzip_min_length   256;
    gzip_vary         on;
    gzip_proxied      any;
    gzip_types        text/plain text/css text/xml text/markdown
                      application/javascript application/json application/xml
                      application/rss+xml application/manifest+json
                      image/svg+xml font/woff font/woff2;

    # Fingerprinted CSS/JS and immutable media. Checked before the catch-all so
    # assets get the long-lived cache policy.
    location ~* \.(css|js|woff2?|ttf|eot|otf|png|jpe?g|gif|webp|avif|svg|ico)$ {
        include    /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        access_log off;
    }

    # Hugo emits ugly URLs off; every page is a directory with index.html.
    location / {
        try_files  $uri $uri/ $uri/index.html =404;
        include    /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=0, must-revalidate" always;
    }

    # netlify.toml: [[redirects]] /* -> /404/ (status 404)
    error_page 404 /404/index.html;
    location = /404/index.html {
        internal;
        include    /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=0, must-revalidate" always;
    }
}
