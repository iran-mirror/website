# Serves the Hugo output. Headers mirror netlify.toml so the container behaves
# like the deployed site.

server {
    listen       8080;
    listen       [::]:8080;
    server_name  _;

    root  /usr/share/nginx/html;
    index index.html;

    charset       utf-8;
    server_tokens off;

    gzip              on;
    gzip_comp_level   6;
    gzip_min_length   256;
    gzip_vary         on;
    gzip_proxied      any;
    gzip_types        text/plain text/css text/xml text/markdown
                      application/javascript application/json application/xml
                      application/rss+xml application/manifest+json
                      image/svg+xml font/woff font/woff2;

    # Fingerprinted CSS/JS and immutable media. Checked before the catch-all so
    # assets get the long-lived cache policy.
    location ~* \.(css|js|woff2?|ttf|eot|otf|png|jpe?g|gif|webp|avif|svg|ico)$ {
        include    /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        access_log off;
    }

    # Hugo emits ugly URLs off; every page is a directory with index.html.
    location / {
        try_files  $uri $uri/ $uri/index.html =404;
        include    /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=0, must-revalidate" always;
    }

    # netlify.toml: [[redirects]] /* -> /404/ (status 404)
    error_page 404 /404/index.html;
    location = /404/index.html {
        internal;
        include    /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=0, must-revalidate" always;
    }
}
